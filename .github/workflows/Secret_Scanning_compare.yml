name: Secret Scanning (Blocking)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secret-scanners:
    name: Compare Secret Scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare custom password detectors
        run: |
          mkdir -p "$RUNNER_TEMP/secret-scan-reports"
          chmod 700 "$RUNNER_TEMP/secret-scan-reports"

          cat > "$RUNNER_TEMP/gitleaks.toml" <<'GITLEAKS_CONFIG'
          title = "Repository secret scanning"

          [extend]
          useDefault = true

          [[rules]]
          id = "password-assignment"
          description = "Password or passphrase assigned in a file"
          regex = '''(?i)(?:password|passwd|pwd)\s*[:=]\s*["']?([^\s"'#]+)'''
          secretGroup = 1
          entropy = 0
          keywords = ["password", "passwd", "pwd"]

          [[rules]]
          id = "postgres-url-password"
          description = "Password embedded in a PostgreSQL connection URL"
          regex = '''(?i)postgres(?:ql)?://[^:\s/@]+:([^\s/@]+)@'''
          secretGroup = 1
          entropy = 0
          keywords = ["postgres://", "postgresql://"]
          GITLEAKS_CONFIG

          cat > "$RUNNER_TEMP/trufflehog.yaml" <<'TRUFFLEHOG_CONFIG'
          detectors:
            - name: Password assignment
              keywords:
                - password
                - PASSWORD
                - passwd
                - PASSWD
                - pwd
                - PWD
              regex:
                assignment: |-
                  (?i)(?:password|passwd|pwd)\s*[:=]\s*["']?([^\s"'#]+)
            - name: PostgreSQL URL password
              keywords:
                - postgres://
                - postgresql://
              regex:
                password: |-
                  (?i)postgres(?:ql)?://[^:\s/@]+:([^\s/@]+)@
          TRUFFLEHOG_CONFIG

      - name: Gitleaks full-history scan
        id: gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/secret-scan-reports:/reports:rw" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/scanner-config/gitleaks.toml:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --log-opts=--all \
              --config /scanner-config/gitleaks.toml \
              --redact=100 \
              --report-format json \
              --report-path /reports/gitleaks.json \
              --exit-code 1 \
              /repo
        continue-on-error: true

      - name: TruffleHog full-history scan
        id: trufflehog
        run: |
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/trufflehog.yaml:/scanner-config/trufflehog.yaml:ro" \
            --workdir /repo \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo \
              --config /scanner-config/trufflehog.yaml \
              --no-update \
              --no-verification \
              --json \
              --fail \
              > "$RUNNER_TEMP/secret-scan-reports/trufflehog.jsonl"
          scan_status=$?
          set -e

          if [[ "$scan_status" -eq 183 ]]; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            echo "::warning::TruffleHog found secrets; see the redacted report below."
          elif [[ "$scan_status" -eq 0 ]]; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TruffleHog exited unexpectedly with status $scan_status."
            exit "$scan_status"
          fi
        continue-on-error: true

      - name: Print redacted Gitleaks and TruffleHog findings
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/secret-scan-reports
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import shutil
          from collections import Counter
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])

          def clean(value):
                value = re.sub(r"[\x00-\x1f\x7f]", " ", str(value or ""))
                return value.replace("|", "\\|").strip()[:240] or "unknown"

          def print_report(name, findings):
                print(f"\n{name} findings (secret values redacted)")
                print("| Target | Type | Secrets |")
                print("|---|---|---:|")
                counts = Counter((item["target"], item["type"]) for item in findings)
                if not counts:
                    print("| No findings | - | 0 |")
                    print("\nTotal: 0")
                    return
                for (target, detector), count in sorted(counts.items()):
                    print(f"| {clean(target)} | {clean(detector)} | {count} |")
                print(f"\nTotal: {len(findings)}")

                print("\nFinding locations:")
                for item in findings:
                    print(
                        f"- {clean(item['target'])}:{clean(item['line'])} "
                        f"({clean(item['type'])}) — [REDACTED]"
                    )

          def read_reports():
                gitleaks_path = report_dir / "gitleaks.json"
                trufflehog_path = report_dir / "trufflehog.jsonl"
                if not gitleaks_path.is_file() or not trufflehog_path.is_file():
                    raise RuntimeError("One or more scanner reports were not created.")

                try:
                    gitleaks_rows = json.loads(gitleaks_path.read_text())
                    trufflehog_rows = [
                        json.loads(line)
                        for line in trufflehog_path.read_text().splitlines()
                        if line.strip()
                    ]
                except (OSError, ValueError):
                    raise RuntimeError("A scanner report could not be parsed; report contents suppressed.")
                if not isinstance(gitleaks_rows, list) or not isinstance(trufflehog_rows, list):
                    raise RuntimeError("A scanner report had an unexpected format; report contents suppressed.")

                gitleaks = [
                    {
                        "target": row.get("File", "unknown"),
                        "type": row.get("RuleID", "secret"),
                        "line": row.get("StartLine", "?"),
                    }
                    for row in gitleaks_rows
                ]

                trufflehog = []
                for row in trufflehog_rows:
                    metadata = row.get("SourceMetadata") or {}
                    data = metadata.get("Data") or {}
                    location = data.get("Git") or data.get("Filesystem") or {}
                    extra_data = row.get("ExtraData") or {}
                    trufflehog.append(
                        {
                            "target": location.get("file", "unknown"),
                            "type": extra_data.get("name") or row.get("DetectorName", "secret"),
                            "line": location.get("line", "?"),
                        }
                    )
                return gitleaks, trufflehog

          try:
                gitleaks_findings, trufflehog_findings = read_reports()
                print_report("Gitleaks", gitleaks_findings)
                print_report("TruffleHog", trufflehog_findings)
          except RuntimeError as error:
                print(f"::error::{clean(error)}")
                raise SystemExit(1)
          finally:
                shutil.rmtree(report_dir, ignore_errors=True)
          PY

      # Scanner output includes detector and location details, but never raw secret values.
      - name: Run Trivy filesystem secret scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      - name: Enforce blocking scanner results
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
          TRUFFLEHOG_FINDINGS: ${{ steps.trufflehog.outputs.findings }}
        run: |
          if [[ "$GITLEAKS_OUTCOME" == "failure" || "$TRUFFLEHOG_OUTCOME" == "failure" || "$TRUFFLEHOG_FINDINGS" == "true" ]]; then
            echo "::error::Gitleaks or TruffleHog reported a failure. Review the scanner output above."
            exit 1
          fi