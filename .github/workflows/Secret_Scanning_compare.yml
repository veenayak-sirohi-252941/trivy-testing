name: Secret Scanning Comparison (Non-blocking)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: trivy_fs_default
            label: Trivy filesystem (default)
          - id: trufflehog_fs_default
            label: TruffleHog filesystem (default)
          - id: gitleaks_fs_default
            label: Gitleaks filesystem (default)
          - id: trufflehog_git_default
            label: TruffleHog Git history (default)
          - id: gitleaks_git_default
            label: Gitleaks Git history (default)
          - id: trivy_fs_custom
            label: Trivy filesystem (custom config)
          - id: trufflehog_fs_custom
            label: TruffleHog filesystem (custom config)
          - id: gitleaks_fs_custom
            label: Gitleaks filesystem (custom config)
          - id: trufflehog_git_custom
            label: TruffleHog Git history (custom config)
          - id: gitleaks_git_custom
            label: Gitleaks Git history (custom config)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run this scan and print redacted findings
        env:
          SCAN_ID: ${{ matrix.id }}
          RESULT_DIR: ${{ runner.temp }}/scan-result
        run: bash manual-scan/gha-scan.sh

      - name: Save this scan's count for the comparison table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary-${{ matrix.id }}
          path: ${{ runner.temp }}/scan-result/*.txt
          if-no-files-found: ignore
          retention-days: 1

  summary:
    name: Scanner comparison summary
    runs-on: ubuntu-latest
    if: always()
    needs: [scan]
    steps:
      - name: Download scan summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scan-summary-*
          path: ${{ runner.temp }}/scan-summaries
          merge-multiple: true

      - name: Print ten-column results table
        env:
          SUMMARY_DIR: ${{ runner.temp }}/scan-summaries
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          columns = [
              "trivy_fs_default",
              "trufflehog_fs_default",
              "gitleaks_fs_default",
              "trufflehog_git_default",
              "gitleaks_git_default",
              "trivy_fs_custom",
              "trufflehog_fs_custom",
              "gitleaks_fs_custom",
              "trufflehog_git_custom",
              "gitleaks_git_custom",
          ]
          summary_dir = Path(os.environ["SUMMARY_DIR"])
          values = {}
          for column in columns:
              result = summary_dir / f"{column}.txt"
              values[column] = result.read_text().strip() if result.is_file() else "NO RESULT"

          header = "| " + " | ".join(columns) + " |"
          separator = "| " + " | ".join("---" for _ in columns) + " |"
          row = "| " + " | ".join(values[column] for column in columns) + " |"
          table = "## Secret scanner findings (counts)\n\n" + header + "\n" + separator + "\n" + row + "\n"
          print(table)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(table)
          PY
