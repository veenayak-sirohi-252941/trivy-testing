name: Trivy Security Scan 2

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:
    inputs:
      scan_path:
        description: 'Path to scan (relative to repository root)'
        required: false
        default: 'snyk-goof'

permissions:
  contents: read

env:
  IMAGE_NAME: snyk-goof
  IMAGE_TAG: testing
  SCAN_PATH: ${{ github.event.inputs.scan_path || 'snyk-goof' }}

jobs:
  discover-and-scan:
    name: Discover Projects & Scan
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate scan path
        run: |
          if [[ "$SCAN_PATH" = /* || ! -d "$SCAN_PATH" ]]; then
            echo "::error::Scan path must be an existing directory relative to the repository root: $SCAN_PATH"
            exit 1
          fi

          SCAN_ROOT="$(realpath -e -- "$SCAN_PATH")"
          case "$SCAN_ROOT/" in
            "$GITHUB_WORKSPACE/"*) ;;
            *)
              echo "::error::Scan path must resolve inside the repository: $SCAN_PATH"
              exit 1
              ;;
          esac

          echo "SCAN_PATH=$SCAN_ROOT" >> "$GITHUB_ENV"

      # ── 2. Install Trivy ─────────────────────────────────────────────────────
      - name: Install Trivy
        run: |
          echo "::group::Installing Trivy"
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version
          echo "::endgroup::"

      # ── 3. Filesystem scan: vuln, misconfig, secret (HIGH/CRITICAL, non-blocking) ──
      - name: "Trivy FS scan (vuln, misconfig, secret)"
        run: |
          echo "::group::Trivy FS Scan - $SCAN_PATH"
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            "$SCAN_PATH"
          echo "::endgroup::"

      # ── 4. IaC / config scan across the repository ─────────────────────────
      - name: "Trivy config scan"
        run: |
          echo "::group::Trivy Config Scan"
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            .
          echo "::endgroup::"

      # ── 5. Build the Docker image to scan ────────────────────────────────────
      - name: Build Docker image
        run: |
          echo "::group::Building Docker image"
          COMPOSE_FILE="$SCAN_PATH/docker-compose.yml"
          if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "::error::No docker-compose.yml found in scan path: $SCAN_PATH"
            exit 1
          fi

          docker compose -f "$COMPOSE_FILE" build goof
          echo "::endgroup::"

      # ── 6. Image scan with VEX document ─────────────────────────────────────
      - name: "Trivy image scan with VEX"
        run: |
          echo "::group::Trivy Image Scan - VEX"
          trivy image \
            --vex ./vex.json \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "::endgroup::"

      # ── 7. Basic image scan ─────────────────────────────────────────────────
      - name: "Trivy image scan"
        run: |
          echo "::group::Trivy Image Scan"
          trivy image \
            --exit-code 0 \
            --format table \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "::endgroup::"

      # ── 8. Image config scan: misconfig + secret only ───────────────────────
      - name: "Trivy image config scan (misconfig, secret)"
        run: |
          echo "::group::Trivy Image Config Scan"
          trivy image \
            --image-config-scanners misconfig,secret \
            --exit-code 0 \
            --format table \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "::endgroup::"

      # ── 9. Full image scan: vuln + misconfig + secret, HIGH/CRITICAL only ───
      - name: "Trivy image full scan (vuln, misconfig, secret - HIGH/CRITICAL)"
        run: |
          echo "::group::Trivy Image Full Scan"
          trivy image \
            --scanners vuln,misconfig,secret \
            --image-config-scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "::endgroup::"