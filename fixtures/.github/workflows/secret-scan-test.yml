name: Secret scanner fixture evaluation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Install Gitleaks release
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan with custom rules
        run: |
          set +e
          gitleaks detect --source . --config .gitleaks.toml --report-format json --report-path gitleaks-history.json
          history_status=$?
          gitleaks detect --source . --config .gitleaks.toml --report-format json --report-path gitleaks-files.json --no-git
          files_status=$?
          echo "Gitleaks history status: $history_status; filesystem status: $files_status"
          # Gitleaks uses exit 1 for findings (and some errors); preserve report
          # artifacts and both scan outputs for review rather than stopping early.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: gitleaks-reports, path: gitleaks-*.json}
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install TruffleHog release
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.9/trufflehog_3.99.9_linux_amd64.tar.gz -o /tmp/trufflehog.tgz
          tar -xzf /tmp/trufflehog.tgz -C /tmp trufflehog
          sudo install /tmp/trufflehog /usr/local/bin/trufflehog
      - name: Scan without credential verification
        run: trufflehog filesystem --no-verification --json . | tee trufflehog.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: trufflehog-report, path: trufflehog.jsonl}
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # v0.3.1
      - name: Run secret scanner
        run: trivy fs --scanners secret --format json --output trivy.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: trivy-report, path: trivy.json}
