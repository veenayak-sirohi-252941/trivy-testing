name: Build fixture project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Synthetic workflow token fixtures (never used for authentication)
        env:
          API_KEY: synthetic_workflow_api_key_fixture_001 # API-016
          JWT_FIXTURE: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJ3b3JrZmxvdyJ9.fixture_signature_only # JWT-005
        run: echo 'Fixture workflow values are not used.'
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -v
