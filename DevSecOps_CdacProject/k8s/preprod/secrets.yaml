# Example-only local credentials; do not use these values in production.
# Replace them with values from a secrets manager before deployment.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: preprod
type: Opaque
stringData:
  POSTGRES_DB: pokemon_db
  POSTGRES_USER: pokemon_user
  POSTGRES_PASSWORD: pokemon_password
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: preprod
type: Opaque
stringData:
  # DATABASE_URL — rebuild this if you change db-credentials above:
  # postgresql://pokemon_user:pokemon_password@database:5432/pokemon_db
  DATABASE_URL: postgresql://pokemon_user:pokemon_password@database:5432/pokemon_db
  JWT_SECRET_KEY: local-dev-secret-only
