# ==============================================================================
# IMPORTANT: Do not commit this file with real values to a public repo.
# Values below are base64-encoded and match the docker-compose.yml defaults
# (pokemon_user / pokemon_password / pokemon_db) so local dev and the EKS
# deployment use the same credentials. Regenerate with:
#   echo -n 'your-value' | base64 -w0
# These are still NOT secure — rotate before this goes anywhere near production,
# and ideally move to a real secrets manager (AWS Secrets Manager / Sealed
# Secrets / External Secrets Operator) instead of committing base64 at all.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: prod
