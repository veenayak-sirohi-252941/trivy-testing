---
- name: Install Docker and deploy Wazuh (single-node)
  hosts: wazuh
  become: true
  vars:
    docker_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    wazuh_repo: https://github.com/wazuh/wazuh-docker.git
    wazuh_version: v4.14.6
    wazuh_clone_dest: /opt/wazuh-docker
    wazuh_stack_dir: /opt/wazuh-docker/single-node

  tasks:
    - name: Refresh apt metadata
      apt:
        update_cache: true
        cache_valid_time: 3600
      retries: 5
      delay: 10
      register: apt_refresh
      until: apt_refresh is succeeded
      timeout: 1800

    - name: Install required system packages
      apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
          - python3-pip
          - python3-venv
          - python3-setuptools
          - git
        state: present
        install_recommends: false
      retries: 3
      delay: 5
      register: apt_install
      until: apt_install is succeeded

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: De-armor Docker GPG key for APT
      command: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        install_recommends: false

    - name: Install Docker module for Python
      apt:
        name: python3-docker
        state: present
        install_recommends: false

    - name: Enable and start Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Set vm.max_map_count for container workloads
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Clone wazuh-docker repository
      ansible.builtin.git:
        repo: "{{ wazuh_repo }}"
        dest: "{{ wazuh_clone_dest }}"
        version: "{{ wazuh_version }}"

    - name: Generate Wazuh indexer SSL certificates
      ansible.builtin.command:
        cmd: docker compose -f generate-indexer-certs.yml run --rm generator
        chdir: "{{ wazuh_stack_dir }}"

    - name: Start Wazuh stack via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ wazuh_stack_dir }}"

    - name: Wait for Wazuh manager container to report healthy
      ansible.builtin.command:
        cmd: docker compose ps --format json
        chdir: "{{ wazuh_stack_dir }}"
      register: wazuh_ps
      retries: 15
      delay: 10
      until: '''"State":"running"'' in wazuh_ps.stdout'

    - name: Show Wazuh Compose status
      ansible.builtin.debug:
        msg: "{{ wazuh_ps.stdout }}"

    # - name: Ensure Wazuh kubernetes agent group exists
    #   ansible.builtin.shell:
    #     cmd: |
    #       docker compose exec -T wazuh.manager /var/ossec/bin/agent_groups -l | grep -qw kubernetes \
    #         || docker compose exec -T wazuh.manager /var/ossec/bin/agent_groups -a -g kubernetes
    #     chdir: "{{ wazuh_stack_dir }}"
    #   register: wazuh_kubernetes_group
    #   changed_when: "'Added group' in wazuh_kubernetes_group.stdout or 'Added group' in wazuh_kubernetes_group.stderr"

    - name: Remove cloned wazuh-docker repository after deployment
      ansible.builtin.file:
        path: "{{ wazuh_clone_dest }}"
        state: absent
